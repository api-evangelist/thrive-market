aid: thrive-market
name: Thrive Market
description: 'Thrive Market is a membership-based online grocery retailer headquartered
  in Marina del Rey, California, selling organic and natural food, pantry staples,
  frozen meat and seafood, beauty and personal care, baby, pet and household products
  directly to consumers across the United States. Members pay an annual or monthly
  fee in exchange for below-retail pricing, and the company operates its own Thrive
  Market private label alongside thousands of third-party brands. It filters its
  catalog by diet, ingredient, certification and social value, accepts EBT/SNAP for
  grocery purchases, and funds free memberships for lower-income families through
  its Thrive Gives program. Thrive Market is a direct-to-consumer commerce company:
  it ships a website and mobile apps to shoppers, but publishes no public developer
  program, API reference, or machine-readable API contract.'
